name: Convert ZIP to MRPack

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to convert (leave empty for latest)'
        required: false
        type: string
      minecraft_version:
        description: 'Minecraft version'
        required: true
        default: '1.20.1'
        type: string
      mod_loader:
        description: 'Mod loader'
        required: true
        default: 'fabric-loader'
        type: choice
        options:
        - fabric-loader
        - forge
        - neoforge
        - quilt-loader
      mod_loader_version:
        description: 'Mod loader version'
        required: true
        default: '0.15.11'
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Get release info
      id: release
      run: |
        if [ -n "${{ github.event.inputs.release_tag }}" ]; then
          TAG="${{ github.event.inputs.release_tag }}"
        else
          TAG=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r .tag_name)
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
    
    - name: Download ZIPs
      run: |
        mkdir -p downloads mrpacks temp
        curl -s "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.release.outputs.tag }}" | \
        jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | \
        while read url; do
          curl -L -o "downloads/$(basename "$url")" "$url"
        done
    
    - name: Install tools
      run: sudo apt-get update && sudo apt-get install -y jq zip unzip uuid-runtime
    
    - name: Convert to MRPack
      run: |
        for zip_file in downloads/*.zip; do
          if [ ! -f "$zip_file" ]; then continue; fi
          
          name=$(basename "$zip_file" .zip)
          temp_dir="temp/$name"
          mrpack_dir="temp/${name}_mrpack"
          
          mkdir -p "$temp_dir" "$mrpack_dir/overrides"
          unzip -q "$zip_file" -d "$temp_dir/"
          
          if [ -d "$temp_dir/minecraft" ]; then
            cp -r "$temp_dir/minecraft/"* "$mrpack_dir/overrides/" 2>/dev/null || true
          fi
          
          version=$(echo "$name" | sed 's/OptiArk\.//' | sed 's/\.zip$//')
          uuid=$(uuidgen | tr '[:upper:]' '[:lower:]')
          
          jq -n \
            --arg uuid "$uuid" \
            --arg version "$version" \
            --arg mc_version "${{ github.event.inputs.minecraft_version }}" \
            --arg loader "${{ github.event.inputs.mod_loader }}" \
            --arg loader_version "${{ github.event.inputs.mod_loader_version }}" \
            '{
              formatVersion: 1,
              game: "minecraft",
              versionId: $uuid,
              name: ("OptiArk " + $version),
              summary: ("OptiArk modpack for Minecraft " + $version),
              files: [],
              dependencies: {
                minecraft: $mc_version,
                ($loader): $loader_version
              }
            }' > "$mrpack_dir/modrinth.index.json"
          
          cd "$mrpack_dir"
          zip -r "../../mrpacks/${name}.mrpack" .
          cd ../..
          
          rm -rf "$temp_dir" "$mrpack_dir"
        done
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mrpack-files
        path: mrpacks/*.mrpack
