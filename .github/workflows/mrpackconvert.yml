name: Build MultiMC MRPack Converter (actual)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'mmcpackconverter/converter.py'
      - 'mmcpackconverter/arrow.png'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mmcpackconverter/converter.py'
      - 'mmcpackconverter/arrow.png'
      - '.github/workflows/build.yml'
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            executable_name: converter.exe
            build_command: pyinstaller --onefile --windowed --add-data "mmcpackconverter/arrow.png;." --name converter mmcpackconverter/converter.py
          - os: ubuntu-latest
            executable_name: converter
            build_command: pyinstaller --onefile --add-data "mmcpackconverter/arrow.png:." --name converter mmcpackconverter/converter.py
          - os: macos-latest
            executable_name: converter
            build_command: pyinstaller --onefile --windowed --add-data "mmcpackconverter/arrow.png:." --name converter mmcpackconverter/converter.py

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PySide6 requests pyinstaller
        # Install system dependencies for Linux
        if [ "$RUNNER_OS" == "Linux" ]; then
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libegl1 libdbus-1-3 libfontconfig1 libxcb-glx0
        fi
      shell: bash

    - name: Verify converter script and arrow.png exist
      run: |
        if [ ! -f "mmcpackconverter/converter.py" ]; then
          echo "Error: mmcpackconverter/converter.py not found"
          exit 1
        fi
        if [ ! -f "mmcpackconverter/arrow.png" ]; then
          echo "Error: mmcpackconverter/arrow.png not found"
          exit 1
        fi
        echo "✅ All required files found"
      shell: bash

    - name: Build executable
      run: |
        ${{ matrix.build_command }}
      shell: bash

    - name: Verify executable was created
      run: |
        if [ "$RUNNER_OS" == "Windows" ]; then
          if [ ! -f "dist/converter.exe" ]; then
            echo "Error: Windows executable not created"
            exit 1
          fi
          echo "✅ Windows executable created successfully"
          ls -la dist/
        elif [ "$RUNNER_OS" == "macOS" ]; then
          if [ ! -f "dist/converter" ]; then
            echo "Error: macOS executable not created"
            exit 1
          fi
          echo "✅ macOS executable created successfully"
          ls -la dist/
          chmod +x dist/converter
        else
          if [ ! -f "dist/converter" ]; then
            echo "Error: Linux executable not created"
            exit 1
          fi
          echo "✅ Linux executable created successfully"
          ls -la dist/
          chmod +x dist/converter
        fi
      shell: bash

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: converter-${{ runner.os }}-${{ github.sha }}
        path: |
          dist/${{ matrix.executable_name }}
        retention-days: 30

    - name: Upload to release (if release)
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: dist/${{ matrix.executable_name }}
        asset_name: converter-${{ runner.os }}-${{ matrix.executable_name }}
        asset_content_type: application/octet-stream

  create-combined-release:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./artifacts

    - name: Display structure of downloaded files
      run: ls -R ./artifacts

    - name: Create combined archive
      run: |
        mkdir -p release
        # Copy executables to release directory with clear names
        cp artifacts/converter-Windows-*/converter.exe release/converter-windows.exe 2>/dev/null || true
        cp artifacts/converter-Linux-*/converter release/converter-linux 2>/dev/null || true
        cp artifacts/converter-macOS-*/converter release/converter-macos 2>/dev/null || true
        
        # Create archives
        cd release
        if [ -f converter-windows.exe ]; then
          zip ../converter-windows.zip converter-windows.exe
        fi
        if [ -f converter-linux ]; then
          tar -czf ../converter-linux.tar.gz converter-linux
        fi
        if [ -f converter-macos ]; then
          tar -czf ../converter-macos.tar.gz converter-macos
        fi
        
        # Create combined archive with all available platforms
        zip ../converter-all-platforms.zip * 2>/dev/null || true
        
        cd ..
        ls -la *.zip *.tar.gz 2>/dev/null || echo "No archives created"

    - name: Upload combined archives to release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          converter-windows.zip
          converter-linux.tar.gz
          converter-macos.tar.gz
          converter-all-platforms.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}