name: Convert ZIP to MRPack

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to convert (leave empty for latest)'
        required: false
        type: string
      minecraft_version:
        description: 'Minecraft version'
        required: true
        default: '1.20.1'
        type: string
      mod_loader:
        description: 'Mod loader'
        required: true
        default: 'fabric-loader'
        type: choice
        options:
        - fabric-loader
        - forge
        - neoforge
        - quilt-loader
      mod_loader_version:
        description: 'Mod loader version'
        required: true
        default: '0.15.11'
        type: string

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Get release info
      id: release
      run: |
        if [ -n "${{ github.event.inputs.release_tag }}" ]; then
          TAG="${{ github.event.inputs.release_tag }}"
        else
          TAG=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r .tag_name)
        fi
        echo "tag=$TAG" >> $GITHUB_OUTPUT
    
    - name: Download ZIPs
      run: |
        mkdir -p downloads mrpacks temp
        curl -s "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.release.outputs.tag }}" | \
        jq -r '.assets[] | select(.name | endswith(".zip")) | .browser_download_url' | \
        while read url; do
          curl -L -o "downloads/$(basename "$url")" "$url"
        done
    
    - name: Install tools
      run: sudo apt-get update && sudo apt-get install -y jq zip unzip uuid-runtime
    
    - name: Convert to MRPack
      run: |
        for zip_file in downloads/*.zip; do
          if [ ! -f "$zip_file" ]; then continue; fi
          
          name=$(basename "$zip_file" .zip)
          temp_dir="temp/$name"
          mrpack_dir="temp/${name}_mrpack"
          
          mkdir -p "$temp_dir" "$mrpack_dir/overrides"
          unzip -q "$zip_file" -d "$temp_dir/"
          
          if [ -d "$temp_dir/minecraft" ]; then
            cp -r "$temp_dir/minecraft/"* "$mrpack_dir/overrides/" 2>/dev/null || true
          fi
          
          # Extract Minecraft version from filename (e.g., OptiArk.1.21.4.zip -> 1.21.4)
          mc_version=$(echo "$name" | sed 's/OptiArk\.//' | sed 's/\.zip$//')
          
          # If version extraction fails, use a default
          if [ -z "$mc_version" ] || [ "$mc_version" = "$name" ]; then
            mc_version="1.20.1"
            echo "⚠️ Could not extract MC version from $name, using default $mc_version"
          else
            echo "✅ Detected Minecraft version $mc_version for $name"
          fi
          
          # Try to detect Fabric Loader version from the extracted files
          fabric_version=""
          
          # Look for fabric-loader in mods folder
          if [ -d "$temp_dir/minecraft/mods" ]; then
            fabric_jar=$(find "$temp_dir/minecraft/mods" -name "*fabric-loader*" -o -name "*fabricloader*" 2>/dev/null | head -1)
            if [ -n "$fabric_jar" ]; then
              # Try to extract version from filename
              fabric_version=$(echo "$fabric_jar" | sed -n 's/.*fabric.*loader.*\([0-9]\+\.[0-9]\+\.[0-9]\+\).*/\1/p')
            fi
          fi
          
          # Look in instance.cfg if it exists
          if [ -z "$fabric_version" ] && [ -f "$temp_dir/instance.cfg" ]; then
            fabric_version=$(grep -o 'fabric-loader-[0-9]\+\.[0-9]\+\.[0-9]\+' "$temp_dir/instance.cfg" | sed 's/fabric-loader-//' | head -1)
          fi
          
          # Look in mmc-pack.json if it exists
          if [ -z "$fabric_version" ] && [ -f "$temp_dir/mmc-pack.json" ]; then
            fabric_version=$(jq -r '.components[]? | select(.uid == "net.fabricmc.fabric-loader") | .version' "$temp_dir/mmc-pack.json" 2>/dev/null)
          fi
          
          # Default based on MC version if still not found
          if [ -z "$fabric_version" ] || [ "$fabric_version" = "null" ]; then
            case "$mc_version" in
              1.20.*) fabric_version="0.16.9" ;;
              1.21.*) fabric_version="0.17.0" ;;
              *) fabric_version="0.16.9" ;;
            esac
            echo "⚠️ Could not detect Fabric version for $name, using default $fabric_version for MC $mc_version"
          else
            echo "✅ Detected Fabric Loader version $fabric_version for $name"
          fi
          
          uuid=$(uuidgen | tr '[:upper:]' '[:lower:]')
          
          jq -n \
            --arg uuid "$uuid" \
            --arg mc_version "$mc_version" \
            --arg pack_name "OptiArk $mc_version" \
            --arg summary "OptiArk modpack for Minecraft $mc_version - Optimized performance pack" \
            --arg fabric_version "$fabric_version" \
            '{
              formatVersion: 1,
              game: "minecraft",
              versionId: $uuid,
              name: $pack_name,
              summary: $summary,
              files: [],
              dependencies: {
                minecraft: $mc_version,
                "fabric-loader": $fabric_version
              }
            }' > "$mrpack_dir/modrinth.index.json"
          
          cd "$mrpack_dir"
          zip -r "../../mrpacks/${name}.mrpack" .
          cd ../..
          
          echo "✅ Created ${name}.mrpack (MC: $mc_version, Fabric: $fabric_version)"
          rm -rf "$temp_dir" "$mrpack_dir"
        done
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mrpack-files
        path: mrpacks/*.mrpack
